name: Publish Docker image

on:
  push:
    branches:
      - 'master'
      - 'v*'
    tags:
      - 'v*'
    paths:
      - '.github/workflows/docker.yml'
      - 'Dockerfile'
      - 'entrypoint.sh'
  pull_request:
  workflow_call:
    inputs:
      version:
        description: 'Version to publish the image as, such as v1.2.3'
        required: true
        type: string
      ref:
        description: 'Commit to build, when it is not the one that started the run'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.prep.outputs.tags }}
      push: ${{ steps.prep.outputs.push }}
      revision: ${{ steps.prep.outputs.revision }}
    steps:
      -
        name: Prepare
        id: prep
        run: |
          DOCKER_IMAGE=ghcr.io/${{ github.repository }}
          VERSION=latest
          SHORTREF=${REVISION::8}

          PUSH=false

          # If this is git tag, use the tag name as a docker tag
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            PUSH=true
          fi

          # Called by the weekly release, which tags the commit only after
          # the image has been pushed.
          if [[ -n "${INPUT_VERSION}" ]]; then
            VERSION=${INPUT_VERSION#v}
            PUSH=true
          fi
          TAGS="${DOCKER_IMAGE}:${VERSION},${DOCKER_IMAGE}:${SHORTREF}"

          # If the VERSION looks like a version number, assume that
          # this is the most recent version of the image and also
          # tag it 'latest'.
          if [[ $VERSION =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            TAGS="$TAGS,${DOCKER_IMAGE}:latest"
          fi

          # A push to master publishes the single moving tag 'main', which
          # the vulnerability tracker scans to tell a fix already on master
          # from one that has been released. The weekly release calls this
          # workflow with master as its ref too, but not as a push.
          if [[ $GITHUB_EVENT_NAME == push && $GITHUB_REF == refs/heads/master ]]; then
            TAGS="${DOCKER_IMAGE}:main"
            PUSH=true
          fi

          # Set output parameters.
          {
            echo "tags=${TAGS}"
            echo "docker_image=${DOCKER_IMAGE}"
            echo "push=${PUSH}"
            echo "revision=${REVISION}"
          } >> "${GITHUB_OUTPUT}"
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REVISION: ${{ inputs.ref || github.sha }}
      -
        # https://github.com/actions/checkout
        name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Docker Buildx (no push)
        uses: docker/build-push-action@v5
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ steps.prep.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.prep.outputs.revision }}

  # Only the runs that push an image (a vX.Y.Z tag, the weekly release, or
  # a push to master) get a token that can write packages.
  publish:
    needs: build
    if: needs.build.outputs.push == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      -
        # https://github.com/actions/checkout
        name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.revision }}
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Docker Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Docker Buildx (push)
        uses: docker/build-push-action@v5
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.build.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.build.outputs.revision }}

  # Each push of 'main' leaves the image it replaced untagged. The action
  # treats a multi-arch image and its platform manifests as one, so it never
  # strips the children of a tagged image. Images younger than an hour are
  # left alone, so that one being pushed by the weekly release at the same
  # time is not taken for untagged before its index is tagged.
  cleanup:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: ghcr-cleanup
    permissions:
      packages: write
    steps:
      -
        # https://github.com/dataaxiom/ghcr-cleanup-action
        name: Delete untagged images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          delete-untagged: true
          older-than: 1 hour
          validate: true
